<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      ;(function () {
        var basePath = '/portfolio'
        var path = window.location.pathname
        var redirectPath = path.startsWith(basePath)
          ? path
          : basePath + path
        var redirect = basePath + '/?redirect=' + encodeURIComponent(redirectPath + window.location.search)

        window.location.replace(redirect + window.location.hash)
      })()
    </script>
  </head>
  <body></body>
</html>
